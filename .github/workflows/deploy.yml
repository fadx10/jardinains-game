name: Build Jardinains for GitHub Pages

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 TypeScript Check
        run: npm run lint

      - name: 🏗️ Run Production Build
        run: |
          npm run build
          mkdir -p build_output
          cp dist/index.html build_output/index.html
          cp -r public/* build_output/ 2>/dev/null || true
          cp favicon.svg build_output/ 2>/dev/null || true
          cp manifest.json build_output/ 2>/dev/null || true
          cp .htaccess build_output/ 2>/dev/null || true

      - name: 📦 Commit generated standalone bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Production bundle is already up to date."
          else
            git commit -m "Sync compiled production bundle"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
