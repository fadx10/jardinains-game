name: Build and Deploy Jardinains to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Run Production Build
        run: |
          npm run build
          mkdir -p build_output
          cp dist/index.html build_output/index.html
          cp -r public/* build_output/ 2>/dev/null || true
          cp .htaccess build_output/ 2>/dev/null || true

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./build_output/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/jardinains/' }}
          dangerous-clean-slate: false
