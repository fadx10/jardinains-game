name: Build Jardinains for GitHub Pages

permissions:
  contents: write

concurrency:
  group: jardinains-pages-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 TypeScript Check
        run: npm run lint

      - name: 🏗️ Run Production Build
        run: |
          npm run build

      - name: 📦 Commit generated standalone bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Production bundle is already up to date."
          else
            git commit -m "Sync compiled production bundle"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
