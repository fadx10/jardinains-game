<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- Safeguard for fetch assignment in iframe sandbox and proxy environments -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(newFetch) { currentFetch = newFetch; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              window.fetch = originalFetch;
            }
          }
        } catch (err) {
          console.warn('Fetch proxy wrapper bypassed or not needed:', err);
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-title" content="Jardinains" />

    <!-- Anti-Clickjacking Frame Safeguard -->
    <script>
    if (window.self !== window.top) {
      try {
        // We are in an iframe (e.g. AI Studio preview). Ensure normal event loops and frame sizing.
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'PING') {
            window.parent.postMessage({ type: 'PONG' }, '*');
          }
        });
      } catch (e) {
        console.warn('Sandbox restrictions applied');
      }
    }
    </script>
