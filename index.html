            var currentFetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(newFetch) { currentFetch = newFetch; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {

          }
        } catch (e) {}

    <!-- Universal Production Loader & Redirect Safeguard -->
    <script>
      (function() {
        var host = window.location.hostname;
        var isDev = host === 'localhost' || 
                    host === '127.0.0.1' || 
                    window.location.port === '3000' ||
                    host.indexOf('ais-dev-') !== -1 ||
                    host.indexOf('ais-pre-') !== -1;
        
        if (!isDev) {
          var pathname = window.location.pathname;
          if (pathname.indexOf('/dist/') === -1) {
            try {
              // Ensure directory URLs have a trailing slash for correct relative path resolution
              var isFile = pathname.split('/').pop().indexOf('.') !== -1;
              if (!isFile && !pathname.endsWith('/')) {
                var newUrl = pathname + '/' + window.location.search + window.location.hash;
                window.history.replaceState(null, '', newUrl);
                pathname += '/';
              }
              
              var pathParts = pathname.split('/');
              if (isFile) pathParts.pop();
              var baseDir = pathParts.join('/');
              if (!baseDir.endsWith('/')) baseDir += '/';
              
              var xhr = new XMLHttpRequest();
              xhr.open('GET', baseDir + 'dist/index.html?v=' + Date.now(), false);
              xhr.send();
              
              if (xhr.status === 200 && xhr.responseText && xhr.responseText.length > 500) {
                if (typeof window.stop === 'function') window.stop();
                document.open();
                document.write(xhr.responseText);
                document.close();
                return;
              }
            } catch (e) {}
            
            if (typeof window.stop === 'function') window.stop();
            window.location.replace(baseDir + 'dist/index.html' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
