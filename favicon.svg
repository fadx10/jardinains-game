<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="hat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background rounded icon container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#22c55e" stroke-width="2" />

  <!-- Mini Brick at Top -->
  <rect x="18" y="8" width="28" height="6" rx="2" fill="url(#brick)" stroke="#fef08a" stroke-width="0.8" />

  <!-- Bouncing Arcade Ball with Glow -->
  <circle cx="48" cy="18" r="5.5" fill="url(#ball)" stroke="#ffffff" stroke-width="0.8" />
  <circle cx="46.5" cy="16.5" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Gnome Red Hat -->
  <path d="M14 42 Q 28 14 36 10 Q 32 30 46 42 Z" fill="url(#hat)" />
  <!-- Hat trim -->
  <ellipse cx="30" cy="42" rx="18" ry="4" fill="#b91c1c" />

  <!-- Gnome Face -->
  <ellipse cx="30" cy="45" rx="12" ry="9" fill="#fed7aa" />

  <!-- Rosy Cheeks -->
  <circle cx="23" cy="46" r="2.5" fill="#f87171" opacity="0.6" />
  <circle cx="37" cy="46" r="2.5" fill="#f87171" opacity="0.6" />

  <!-- Eyes (Mischievous Nain) -->
  <ellipse cx="26" cy="42" rx="1.8" ry="2.2" fill="#0f172a" />
  <circle cx="25.5" cy="41.2" r="0.6" fill="#ffffff" />
  <ellipse cx="34" cy="42" rx="1.8" ry="2.2" fill="#0f172a" />
  <circle cx="33.5" cy="41.2" r="0.6" fill="#ffffff" />

  <!-- Nose -->
  <circle cx="30" cy="45" r="3.2" fill="#fb923c" stroke="#ea580c" stroke-width="0.5" />

  <!-- Beard -->
  <path d="M19 46 Q 30 62 41 46 Q 36 56 30 56 Q 24 56 19 46 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5" />
</svg>
